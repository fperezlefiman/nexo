name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXO_DATABASE_URL: postgresql://nexo:nexo@127.0.0.1:5432/nexo
      # Same database on purpose: the queue tests truncate what they use, and there is no engine here.
      NEXO_TEST_DATABASE_URL: postgresql://nexo:nexo@127.0.0.1:5432/nexo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: nexo migrate
      # Live contract tests skip themselves: the engine is not running in CI.
      - run: pytest -q
