[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo"
version = "0.1.0"
description = "Orquestador personal de agentes LLM sobre el servidor de OpenCode"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
vectors = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[project.scripts]
nexo = "nexo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexo = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requiere el servidor de OpenCode corriendo en local"]
